name: host-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc device-tree-compiler dosfstools mtools fdisk file
      - name: Host parsers + disk image
        run: make test
      - name: ASan / UBSan
        run: make test-asan CC=gcc
